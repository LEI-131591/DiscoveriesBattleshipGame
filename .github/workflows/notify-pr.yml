name: Notify PR

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Notify responsible colleague
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Foi aberto um novo Pull Request. Por favor, verifica-o.'
            })
